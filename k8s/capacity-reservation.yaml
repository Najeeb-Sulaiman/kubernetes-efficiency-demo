apiVersion: v1
kind: Pod

metadata:
  name: capacity-reservation

spec:
  containers:
    - name: reservation
      image: busybox:1.36

      command:
        - sh
        - -c
        - sleep 36000

      resources:
        requests:
          cpu: "8400m"
          memory: "32Mi"
        limits:
          cpu: "8400m"
          memory: "32Mi"
