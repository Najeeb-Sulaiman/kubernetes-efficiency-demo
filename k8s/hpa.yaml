
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: customer-event-processor

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-event-processor

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
